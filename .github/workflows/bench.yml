name: bench-sweep

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Space-separated task IDs (blank = all)"
        required: false
        default: ""
      seeds:
        description: "Seeds per (agent, task)"
        required: false
        default: "1"
  schedule:
    # 06:30 UTC nightly. Override or remove if you want a different cadence.
    - cron: "30 6 * * *"

concurrency:
  group: bench-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      ZOO_API_KEY: ${{ secrets.ZOO_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip install
        run: pip install -r bench/requirements.txt
      - name: init schema (idempotent)
        run: python -m bench.db_init
      - name: author + upload reference parts
        run: python -m bench.seed
      - name: sweep
        run: |
          if [ -n "${{ github.event.inputs.tasks }}" ]; then
            python -m bench.run --tasks ${{ github.event.inputs.tasks }} --seeds ${{ github.event.inputs.seeds || '1' }}
          else
            python -m bench.run --seeds ${{ github.event.inputs.seeds || '1' }}
          fi
      - name: aggregate
        run: python -m bench.aggregate
      - name: revalidate site
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
